/* ===== 1 clocks: 20 days ===== */
function clocks(){

 function init(w,h){const l=L(w,h),cols=l.wide?5:4,rows=Math.ceil(20/cols),cell=Math.min(l.aw/cols,l.ah/rows);g={cols,cell,r:cell*.41,x0:l.cx-cols*cell/2,y0:l.cy-rows*cell/2,lx:l.cx,ly:l.ly}}
 function seg(c,cx,cy,r,a,b,col,k){const s=Math.max(a,24*k),e=Math.min(b,24*k+24);if(e<=s)return;
  c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r,-Math.PI/2+(s-24*k)/24*6.2832,-Math.PI/2+(e-24*k)/24*6.2832);c.closePath();c.fillStyle=col;c.fill()}

   const on=m.on&&Math.hypot(m.x-cx,m.y-cy)<r&&H>24*k;hv[k]+=((on?1:0)-hv[k])*.2;if(on){hov=k;hx=m.x;hy=m.y}
   c.save();c.translate(cx,cy);const z=1+.07*hv[k];c.scale(z,z);c.translate(-cx,-cy);
   c.beginPath();c.arc(cx,cy,r,0,7);c.fillStyle='#0b0b0f';c.fill();c.lineWidth=1.5;c.strokeStyle='#24242c';c.stroke();
   c.save();c.shadowBlur=r*.45;c.shadowColor=TT;seg(c,cx,cy,r*.97,0,Math.min(HT,H),TT,k);c.shadowColor=IG;if(H>HT)seg(c,cx,cy,r*.97,HT,Math.min(HA,H),IG,k);c.restore();
   c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=1;for(let q=0;q<4;q++){const a=q*1.5708;c.beginPath();c.moveTo(cx+Math.cos(a)*r*.82,cy+Math.sin(a)*r*.82);c.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);c.stroke()}
   if(k===act){const a=-Math.PI/2+(H-24*k)/24*6.2832;c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);c.stroke()}

   tip(c,w,hx,hy,'Day '+(hov+1)+': '+(tt?tt+' h TikTok':'')+(tt&&ig?', ':'')+(ig?ig+' h Instagram':''))}

/* ===== 2 flatline: cruise ===== */
function flat(){
 const T=DATA.febT,I=DATA.febI,n=T.length;let g,hx=-1;
 const off=i=>T[i]<.25&&I[i]<.25,offIdx=[...Array(n).keys()].filter(off);
 const sh=[[0,0],[.14,0],[.2,.1],[.28,0],[.36,0],[.4,-.12],[.46,1],[.52,-.28],[.58,0],[.68,0],[.76,.22],[.86,0],[1,0]];
 function init(w,h){const l0=L(w,h),ah0=Math.min(l0.ah,l0.aw*.72),l=Object.assign({},l0,{ah:ah0,y0:l0.cy-ah0/2}),cw=l.aw/n,mx=l.x0,yT=l.cy-l.ah*.2,yI=l.cy+l.ah*.26,sc=l.ah*.2/Math.max(...T);
  const mk=(arr,yb)=>{const p=[];for(let i=0;i<n;i++)for(const q of sh)p.push([mx+(i+q[0])*cw,yb-q[1]*arr[i]*sc]);return p};
  g={l,cw,mx,yT,yI,pT:mk(T,yT),pI:mk(I,yI),np:n*sh.length,lx:l0.cx,ly:l0.ly}}
 const head=t=>RM?1:clamp((t-.2)/4.4);
 function line(c,p,f,col){const m=Math.floor(f*(g.np-1));c.save();c.strokeStyle=col;c.lineWidth=2.2;c.shadowColor=col;c.shadowBlur=10;c.lineJoin='round';c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<=m;i++)c.lineTo(p[i][0],p[i][1]);c.stroke();c.restore();return p[m]}
 function draw(c,w,h,t,dt,m){

  c.strokeStyle='#14141a';c.lineWidth=1;for(let i=0;i<=n;i+=7){c.beginPath();c.moveTo(g.mx+i*g.cw,l.y0);c.lineTo(g.mx+i*g.cw,l.y0+l.ah);c.stroke()}
  c.setLineDash([3,6]);c.strokeStyle='#26262e';[g.yT,g.yI].forEach(y=>{c.beginPath();c.moveTo(g.mx,y);c.lineTo(g.mx+l.aw,y);c.stroke()});c.setLineDash([]);
  const day=f*n;
  offIdx.forEach(i=>{const a=clamp(day-i-.5);if(a<=0)return;c.fillStyle='rgba(255,255,255,'+(.07*a)+')';c.fillRect(g.mx+i*g.cw,g.yT-l.ah*.26,g.cw,g.yI-g.yT+l.ah*.4)});
  const hT=line(c,g.pT,f,TT),hI=line(c,g.pI,f,IG);

  c.font=mono(11);c.textAlign='left';c.fillStyle=TT;c.fillText('TIKTOK',g.mx,g.yT-l.ah*.27);c.fillStyle=IG;c.fillText('INSTAGRAM',g.mx,g.yI-l.ah*.14);
  c.fillStyle='#666';c.fillText('1 FEB',g.mx,g.yI+l.ah*.2);c.textAlign='right';c.fillText('28 FEB',g.mx+l.aw,g.yI+l.ah*.2);

  if(hi>=0){const x=g.mx+(hi+.5)*g.cw;hx=hx<0?x:hx+(x-hx)*.3;c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=1;c.beginPath();c.moveTo(hx,l.y0);c.lineTo(hx,l.y0+l.ah);c.stroke();
   tip(c,w,hx,m.y,(hi+1)+' Feb: TikTok '+T[hi].toFixed(1)+' h, Instagram '+I[hi].toFixed(1)+' h')}else hx=-1}

/* ===== 4 delete: Instagram goes, TikTok grows ===== */
function del(){
 let g,parts=[];const V=[248,279,353],NM=['JANUARY','FEBRUARY','MARCH'],hv=[0,0,0];let pxo=0,pyo=0;
 function init(w,h){const l=L(w,h),R=Math.min(l.aw*.145,l.ah*.34),r=V.map(v=>R*Math.sqrt(v/353)),gap=R*.4,tot=2*(r[0]+r[1]+r[2])+2*gap,x0=l.cx-tot/2,cy=l.cy;

  parts=[];for(let i=0;i<64;i++)parts.push({a:rnd()*6.283,d:g.S*(.25+rnd()*.7),dl:i*.008,s:1+rnd()*2.2})}
 const prog=t=>RM?1:clamp((t-2.45)/1.1),pin=(t,d)=>RM?1:clamp((t-d)/.8);
 function circ(c,x,y,r,k,val,month,hov,main,al){

  c.font='500 '+Math.round(rr_*.13)+'px Inter,system-ui,sans-serif';c.fillText('TIKTOKS PER DAY',x,y+rr_*.38);c.fillText(month,x,y-rr_*.42);c.restore()}
 function draw(c,w,h,t,dt,m){

   c.save();c.translate(g.tx,g.ty);c.rotate(rot);c.scale(Math.max(sc,.001),Math.max(sc,.001));c.globalAlpha=Math.max(al,0);
   const gr=c.createLinearGradient(-S/2,S/2,S/2,-S/2);gr.addColorStop(0,'#ff8a3d');gr.addColorStop(.5,IG);gr.addColorStop(1,'#8a3dff');c.fillStyle=gr;rr(c,-S/2,-S/2,S,S,S*.24);c.fill();
   c.fillStyle='#fff';c.font='600 '+Math.round(S*.15)+'px Inter,sans-serif';c.textAlign='center';c.fillText('Instagram',0,S*.06);
   if(t>.6){const b=clamp((t-.6)/.25),bx=-S/2+2,by=-S/2+2;c.fillStyle='#16161c';c.beginPath();c.arc(bx,by,S*.13*eob(b),0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();const q=S*.05*b;c.moveTo(bx-q,by-q);c.lineTo(bx+q,by+q);c.moveTo(bx+q,by-q);c.lineTo(bx-q,by+q);c.stroke()}
   c.restore();c.save();c.globalAlpha=Math.max(al,0);c.fillStyle='#9a9a9a';c.font=mono(11);c.textAlign='center';c.fillText('March: I deleted Instagram',g.tx,g.ty+S/2+30);c.restore()}
  parts.forEach(p=>{const q=clamp((t-1.75-p.dl)/.75);if(q<=0||q>=1)return;const e=eio(q),sx=g.tx+Math.cos(p.a)*p.d*Math.min(1,q*4),sy=g.ty+Math.sin(p.a)*p.d*Math.min(1,q*4);

/* ===== 5 rush: 1,352 in one day ===== */
function rush(){

   c.fillStyle='#000';const tw=128;c.fillRect(g.x0+g.cols*cs-tw-4,y-9,tw,18);c.fillStyle=TT;c.font=mono(11);c.textAlign='right';c.fillText('Normal day: 417',g.x0+g.cols*cs-8,y+4);c.globalAlpha=1}}

/* ===== 6 speed: 19 s against 12 s ===== */
function speed(){

 function init(w,h){const l=L(w,h);if(l.wide){const r=Math.min(l.aw*.21,l.ah*.34);g={r,a:[l.cx-l.aw*.25,l.cy],b:[l.cx+l.aw*.25,l.cy]}}else{const r=Math.min(l.aw*.24,l.ah*.17);g={r,a:[l.cx,l.cy-l.ah*.25],b:[l.cx,l.cy+l.ah*.22]}}g.lx=l.cx;g.ly=l.ly}
